[pip.deps]
juliapkg = "~=0.1.10"
openmdao = "~=3.41"
omjlcomps = ""

[deps.python]
# PythonCall.jl's vendored find_libpython.py cannot locate libpython for
# Python >= 3.15 (as of PythonCall 0.9.36), so keep conda-forge's newest
# Python from being selected when a fresh environment is resolved.
version = ">=3.10,<3.15"
