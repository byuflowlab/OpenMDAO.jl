[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = 'omjlcomps'
description = "Create OpenMDAO Components using the Julia programming language"
readme = "README.md"
keywords = ["openmdao_component"]
license = {text = "MIT"}
version = "0.2.7"

dependencies = [
    "openmdao~=3.42",
    "juliapkg~=0.1.10",
    "juliacall~=0.9.13",
]

[project.optional-dependencies]
test = ["aviary"]

[project.entry-points.openmdao_component]
juliaexplicitcomp = "omjlcomps:JuliaExplicitComp"
juliaimplicitcomp = "omjlcomps:JuliaImplicitComp"

# Tell Hatch to find the single file inside src/
[tool.hatch.build.targets.wheel]
packages = ["src/omjlcomps.py"]
