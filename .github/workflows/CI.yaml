name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'

jobs:
  OpenMDAOCore_jl:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version:
          - '1' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
        os:
          - ubuntu-latest
          - macOS-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - name: Add General Registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General"))
      - name: OpenMDAOCore.jl Tests
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("./julia/OpenMDAOCore.jl")
          Pkg.update()
          Pkg.test()

  OpenMDAO_jl:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        julia-version:
          - '1' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
        os:
          - ubuntu-latest
          - macOS-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.arch }}
      - name: Add General Registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General"))
      - name: OpenMDAO.jl Tests
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("./julia/OpenMDAO.jl")
          Pkg.develop(path="./julia/OpenMDAOCore.jl")
          using CondaPkg
          # Path needs to be relative to the CondaPkg.toml file, which is in julia/OpenMDAO.jl.
          CondaPkg.add_pip("omjlcomps"; version="@./../../python", editable=true)
          Pkg.instantiate()
          Pkg.update()
          Pkg.test()

  omjlcomps:
    name: Python ${{ matrix.python-version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        julia-version:
          - '1.12' # Leave this line unchanged. '1' will automatically expand to the latest stable 1.x release of Julia.
        os:
          - ubuntu-latest
          - macOS-latest
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # No idea why this is segfaulting.
          # Only sometimes.
          - os: macOS-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.julia-version }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Add General Registry
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(RegistrySpec(url="https://github.com/JuliaRegistries/General"))
      - name: Install juliapkg
        run: |
          echo "PWD = $PWD"
          python -m pip install --upgrade pip
          pip install juliapkg'[cli]'
          python -m juliapkg resolve
      - name: omjlcomps install
        run: |
          echo "PWD = $PWD"
          # WTF?
          python -m juliapkg run -E 'using Pkg; rm(joinpath(DEPOT_PATH[1], "registries", "General"), force=true, recursive=true); Pkg.Registry.add("General")'
          python -m juliapkg add --dev --path=$PWD/julia/OpenMDAOCore.jl --target=$PWD/python/src/juliapkg.json OpenMDAOCore
          pip install --config-settings editable_mode=compat -e ./python
      - name: omjlcomps tests
        run: |
          echo "PWD = $PWD"
          cd python/test
          python test_julia_explicit_comp.py
          python test_julia_implicit_comp.py
          python test_explicit_ad_shape_by_conn.py
          python test_implicit_ad_comps.py
      - name: test examples
        run: |
          echo "PWD = $PWD"
          cd ./examples/example_python_package_openmdao_jl
          python -m juliapkg add --dev --path=$PWD/../../julia/OpenMDAOCore.jl --target=$PWD/example_python_package_openmdao_jl/juliapkg.json OpenMDAOCore
          pip install --config-settings editable_mode=compat -e .
          python ./scripts/run_paraboloid.py
          python ./example_python_package_openmdao_jl/test/test_paraboloid_example.py
          python ./scripts/run_circle.py
          python ./example_python_package_openmdao_jl/test/test_circle_example.py
          python ./scripts/run_circuit.py
          python ./example_python_package_openmdao_jl/test/test_circuit_example.py
